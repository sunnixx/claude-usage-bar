name: CI

on:
  push:
    branches: ['**']
  pull_request:

# This matrix deliberately does NOT run one identical toolchain on all three
# OSes:
#   - macOS builds with the Xcode-preinstalled Swift toolchain (no setup-swift
#     step): pairing setup-swift's Swift 6.0.3 toolchain with the runner's
#     Xcode 26.6 SDK fails ("this SDK is not supported by the compiler").
#   - Linux and Windows install Swift 6.1 via setup-swift: Swift 6.0.3's
#     Windows toolchain hits a cyclic-module bug (ucrt -> _Builtin_intrinsics
#     -> ucrt), fixed in 6.1.
# What this proves: swift-tools-version 6.0 compatibility on macOS, Linux,
# and Windows, each on its best available toolchain. What it does NOT prove:
# behavioral parity across a single pinned toolchain version.
jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # macos-latest already ships an Xcode toolchain whose Swift compiler
      # matches its SDK. Installing a separate Swift 6.0.3 toolchain via
      # setup-swift there causes an SDK/compiler version mismatch
      # ("this SDK is not supported by the compiler"), so only install on
      # Linux and Windows, which have no preinstalled Swift toolchain.
      - name: Set up Swift
        if: runner.os != 'macOS'
        uses: SwiftyLab/setup-swift@v1.14.0
        with:
          swift-version: "6.1"

      # libayatana-appindicator and GTK are needed from Task 6 onward. Installed
      # now so the workflow does not change when the Linux backend lands.
      - name: Install Linux tray dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libayatana-appindicator3-dev libgtk-3-dev

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test
